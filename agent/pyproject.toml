[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashpilot"
version = "0.1.0"
description = "CashPilot: AI invoice-factoring and cash-flow copilot for SMEs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "web3>=7.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "streamlit>=1.35",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["cashpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
